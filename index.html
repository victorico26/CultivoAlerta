<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CultivoAlerta · Alertas climáticas para tu finca</title>
<meta name="description" content="Alertas de heladas, sequía e inundación para la finca del pequeño productor. Piloto Sabana de Bogotá.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="video/dron_portada.jpg">
<style>
  :root { --verde: #1f5130; --verde-2: #2f7a47; --hoja: #8fd16a; --agua: #5ec8f2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d1a12; color: #fff; font-family: Inter, system-ui, sans-serif; overflow: hidden; }
  /* Video a pantalla completa, recortado para llenar cualquier formato de pantalla */
  .fondo { position: fixed; inset: 0; background: #0d1a12 url("video/dron_portada.jpg") center / cover no-repeat; }
  .fondo video { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 1.2s ease; }
  .fondo video.listo { opacity: 1; }
  /* Velo para que el texto blanco se lea sobre el cielo claro */
  .velo { position: fixed; inset: 0; background:
    radial-gradient(ellipse at 50% 50%, rgba(8, 20, 12, 0.32) 0%, rgba(8, 20, 12, 0.18) 45%, rgba(8, 20, 12, 0.5) 100%),
    linear-gradient(to bottom, rgba(8, 20, 12, 0.2), rgba(8, 20, 12, 0) 35%, rgba(8, 20, 12, 0.55)); }
  .portada { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px 16px; gap: 18px; }
  .logo { width: clamp(78px, 13vw, 120px); height: auto; filter: drop-shadow(0 6px 22px rgba(0, 0, 0, 0.45)); }
  h1 { margin: 0; font-size: clamp(42px, 9vw, 104px); font-weight: 800; letter-spacing: -0.03em; line-height: 1; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.45); }
  h1 .alerta { color: var(--hoja); }
  .lema { margin: 0; max-width: 620px; font-size: clamp(16px, 2.2vw, 21px); line-height: 1.45; color: rgba(255, 255, 255, 0.92); text-shadow: 0 2px 14px rgba(0, 0, 0, 0.5); }
  .entrar { margin-top: 10px; display: inline-flex; align-items: center; gap: 10px; padding: 15px 30px; border: 0; border-radius: 40px; background: var(--hoja); color: #10301c;
    font: 700 17px Inter, sans-serif; text-decoration: none; cursor: pointer; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35); transition: transform 0.2s, background 0.2s, box-shadow 0.2s; }
  .entrar:hover, .entrar:focus-visible { background: #a6e283; transform: translateY(-2px); box-shadow: 0 12px 34px rgba(0, 0, 0, 0.45); outline: none; }
  .entrar:focus-visible { box-shadow: 0 0 0 3px #fff, 0 12px 34px rgba(0, 0, 0, 0.45); }
  .entrar svg { transition: transform 0.2s; }
  .entrar:hover svg { transform: translateX(4px); }
  .pie { position: fixed; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 12px; color: rgba(255, 255, 255, 0.75); padding: 0 16px; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6); }
  .control { position: fixed; right: 16px; top: 16px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.5); background: rgba(0, 0, 0, 0.25); color: #fff; cursor: pointer; display: grid; place-items: center; }
  .control:hover { background: rgba(0, 0, 0, 0.45); }

  /* Transiciones de entrada: logo, título letra a letra, lema y botón, uno tras otro */
  .aparece { opacity: 0; transform: translateY(18px); animation: aparecer 1s cubic-bezier(.2, .7, .2, 1) forwards; }
  .logo.aparece { transform: scale(0.6) rotate(-12deg); animation: logo 1.1s cubic-bezier(.2, .9, .3, 1.2) 0.4s forwards; }
  h1 span.letra { display: inline-block; opacity: 0; transform: translateY(0.4em); filter: blur(6px); animation: letra 0.7s cubic-bezier(.2, .7, .2, 1) forwards; }
  .lema.aparece { animation-delay: 2.3s; }
  .entrar.aparece { animation-delay: 2.9s; }
  .pie.aparece { animation-delay: 3.4s; }
  @keyframes aparecer { to { opacity: 1; transform: none; } }
  @keyframes logo { to { opacity: 1; transform: none; } }
  @keyframes letra { to { opacity: 1; transform: none; filter: none; } }
  /* Salida al entrar a la aplicación */
  body.saliendo .portada, body.saliendo .pie, body.saliendo .control { transition: opacity 0.6s, transform 0.6s; opacity: 0; transform: scale(1.04); }
  body.saliendo .velo { transition: background-color 0.6s; background-color: #f6f8f6; }
  @media (prefers-reduced-motion: reduce) {
    .aparece, .logo.aparece, h1 span.letra { animation: none; opacity: 1; transform: none; filter: none; }
    .fondo video { display: none; }
  }
</style>
</head>
<body>
  <div class="fondo"><video id="video" muted loop playsinline preload="auto" poster="video/dron_portada.jpg" aria-hidden="true"></video></div>
  <div class="velo"></div>

  <main class="portada">
    <svg viewBox="0 0 40 40" class="logo aparece" role="img" aria-label="Logo de CultivoAlerta"><circle cx="20" cy="20" r="19" fill="#1f5130"/><path d="M12 26c0-9 7-15 17-15-1 10-7 16-15 16" fill="#8fd16a"/><path d="M13 28c3-5 7-9 12-12" stroke="#1f5130" stroke-width="1.6" fill="none"/><path d="M27 22c0 0 4 4.5 4 7a4 4 0 0 1-8 0c0-2.5 4-7 4-7z" fill="#5ec8f2"/></svg>
    <h1 id="titulo" aria-label="CultivoAlerta">CultivoAlerta</h1>
    <p class="lema aparece">Alertas de heladas, sequía e inundación para la finca del pequeño productor. Piloto en la Sabana de Bogotá.</p>
    <a class="entrar aparece" id="entrar" href="app.html">Entrar a mi finca
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </main>

  <p class="pie aparece">Toma aérea con dron del autor · Trabajo final de TIG, Especialización en Análisis Espacial, Universidad Nacional de Colombia · Herramienta orientativa</p>
  <button class="control" id="pausa" type="button" aria-label="Pausar el video" title="Pausar el video">
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="3.5" height="12" fill="currentColor"/><rect x="8.5" y="1" width="3.5" height="12" fill="currentColor"/></svg>
  </button>

<script>
  "use strict";
  // Título letra a letra: «Cultivo» en blanco y «Alerta» en verde hoja
  const h1 = document.getElementById("titulo");
  h1.innerHTML = [..."CultivoAlerta"].map((c, i) => `<span class="letra${i >= 7 ? " alerta" : ""}" aria-hidden="true" style="animation-delay:${(1.1 + i * 0.06).toFixed(2)}s">${c}</span>`).join("");

  // Video: 720p en celulares (pantalla de hasta ~1000 px de ancho) o con ahorro de datos; 1080p en computadores
  const video = document.getElementById("video");
  const chica = Math.max(innerWidth, innerHeight) <= 1000 || navigator.connection?.saveData;
  video.src = chica ? "video/dron_720.mp4" : "video/dron_1080.mp4";
  video.addEventListener("playing", () => video.classList.add("listo"), { once: true });
  video.play().catch(() => {});   // si el navegador no deja reproducir solo, queda la foto de portada

  const pausa = document.getElementById("pausa");
  const iconoPausa = pausa.innerHTML, iconoPlay = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg>';
  pausa.onclick = () => {
    if (video.paused) { video.play().catch(() => {}); pausa.innerHTML = iconoPausa; pausa.ariaLabel = pausa.title = "Pausar el video"; }
    else { video.pause(); pausa.innerHTML = iconoPlay; pausa.ariaLabel = pausa.title = "Reproducir el video"; }
  };

  // Al entrar: la portada se desvanece y abre la aplicación
  document.getElementById("entrar").addEventListener("click", (e) => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    e.preventDefault();
    const destino = e.currentTarget.href;
    document.body.classList.add("saliendo");
    setTimeout(() => (location.href = destino), 550);
  });
  // Al volver con «Atrás», la portada aparece de nuevo
  addEventListener("pageshow", () => document.body.classList.remove("saliendo"));
</script>
</body>
</html>
